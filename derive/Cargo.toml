[package]
name = "spongefish-derive"
description = "Derive macros for the spongefish Fiat-Shamir library"
documentation = "https://docs.rs/spongefish-derive"
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["derive"] }

[dev-dependencies]
# Keep this test-only dependency out of the published manifest so derive can
# be published before spongefish, which depends on it.
spongefish = { path = "../spongefish", default-features = false }

[lints]
workspace = true
