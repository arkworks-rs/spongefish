[workspace]
changelog_update = true
git_release_enable = false
git_tag_enable = false
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
release_always = false
repo_url = "https://github.com/arkworks-rs/spongefish"
# The NARG string bytes are a wire format.
# Run cargo-semver-checks on every release PR.
semver_check = true

[[package]]
name = "spongefish"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
version_group = "workspace"

[[package]]
name = "spongefish-circuit"
version_group = "workspace"

[[package]]
name = "spongefish-derive"
version_group = "workspace"

[[package]]
name = "spongefish-pow"
version_group = "workspace"
