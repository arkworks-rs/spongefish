[package]
name = "spongefish"
authors = ["Michele Orrù <m@orru.net>", "Giacomo Fenzi <giacomofenzi@outlook.com>"]
description = "An implementation of the Fiat--Shamir transformation from Duplex Sponges."
documentation = "https://docs.rs/spongefish"
edition.workspace = true
readme.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "doc/katex-header.html", "--cfg", "docsrs"]

[features]
default = ["turboshake128", "getrandom", "zeroize"]
# feature flag for hazardous features
yolocrypto = []
# Core features
derive = ["dep:spongefish-derive"]
zeroize = ["dep:zeroize", "shake?/zeroize", "turboshake?/zeroize"]
# The draft-irtf-cfrg-fiat-shamir suites (SHAKE128 and TurboSHAKE128) and StdHash.
turboshake128 = ["dep:shake", "dep:turboshake"]
# Prover randomness: OS entropy for the private RNG (default), and an optional
# rand_core adapter so the RNG can be passed to ecosystem samplers.
getrandom = ["dep:getrandom"]
rand = ["dep:rand_core"]
# Additional permutation functions
keccak = ["dep:keccak"]
ascon = ["dep:ascon"]

[dependencies]
ascon = { version = "^0.5.0", optional = true }
digest = { workspace = true }
getrandom = { workspace = true, optional = true }
keccak = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
shake = { workspace = true, optional = true }
turboshake = { workspace = true, optional = true }
spongefish-derive = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["zeroize_derive"], optional = true }

[dev-dependencies]
curve25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[[example]]
name = "schnorr"
required-features = ["getrandom", "turboshake128"]
