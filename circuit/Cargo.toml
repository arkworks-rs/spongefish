[package]
name = "spongefish-circuit"
description = "Circuits for proving relations over spongefish."
documentation = "https://docs.rs/spongefish-circuit"
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
# Higher than the workspace floor: the Plonky3 dependencies behind the default
# `p3-baby-bear` feature need a newer compiler (`p3-util` uses the unstable
# `maybe_uninit_slice` before 1.93). This crate's own code builds on 1.88.
rust-version = "1.93"
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["p3-baby-bear"]
p3-baby-bear = ["dep:p3-baby-bear", "dep:p3-field"]

[dependencies]
# Optional Plonky3/BabyBear support
p3-baby-bear = { workspace = true, optional = true }
p3-field = { workspace = true, optional = true }
spin = { workspace = true }
spongefish = { workspace = true, default-features = true, features = ["derive"] }

[dev-dependencies]
p3-baby-bear = { workspace = true }
# The README doctests run the byte examples over Keccak-f[1600] and the
# proof-of-work example over `spongefish-pow`; see `readme_doctests` in
# `src/lib.rs`.
spongefish = { workspace = true, default-features = true, features = ["derive", "keccak"] }
# Path-only on purpose: without a version, cargo drops this test-only
# dependency from the published manifest, so this crate can be published
# before `spongefish-pow` (release-plz does not order by dev-dependencies).
spongefish-pow = { path = "../pow" }

[lints]
workspace = true
