[package]
name = "spongefish-pow"
description = "Proof-of-work challenge grinding for spongefish."
documentation = "https://docs.rs/spongefish-pow"
authors = [
    "Giacomo Fenzi <giacomofenzi@outlook.com>",
    "Remco Bloemen <remco@wicked.ventures>",
]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
spongefish = { workspace = true }

[dev-dependencies]
spongefish = { workspace = true, default-features = true, features = ["keccak"] }

[lints]
workspace = true
