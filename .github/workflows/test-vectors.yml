name: Vector provenance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify vendored vectors against the recorded upstream revision
        run: python3 scripts/check-vector-provenance.py
