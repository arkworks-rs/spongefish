[workspace]
members = ["circuit", "derive", "pow", "spongefish"]
resolver = "2"

[workspace.package]
edition = "2021"
# Minimum supported Rust version, enforced by the `msrv` CI job; bump it only
# with a deliberate (minor-version) release. This is what `spongefish`,
# `spongefish-derive` and `spongefish-pow` require. `spongefish-circuit`
# declares a higher floor of its own: its Plonky3 dependencies need a newer
# compiler, and that must not be charged to the core library.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
version = "0.7.4"
repository = "https://github.com/arkworks-rs/spongefish"
homepage = "https://github.com/arkworks-rs/spongefish"

[workspace.lints.clippy]
# all lints that are on by default (correctness, suspicious, style, complexity, perf)
all = { level = "warn", priority = -1 }

# new lints that are still under development
nursery = { level = "warn", priority = -1 }
# avoid lints that are too pedantic
doc_markdown = "allow"

# lints which are rather strict or have occasional false positives
pedantic = { level = "warn", priority = -1 }
# avoid lints that are too pedantic
cast_possible_truncation = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
default_trait_access = "allow"
module_name_repetitions = "allow"
missing_safety_doc = "allow"
many_single_char_names = "allow"
should_panic_without_expect = "allow"
similar_names = "allow"
too_long_first_doc_paragraph = "allow"
doc_lazy_continuation = "allow"
tuple_array_conversions = "allow"
naive_bytecount = "allow"

[workspace.dependencies]
blake3 = { version = "^1.8.4", features = ["traits-preview", "zeroize"] }
bytemuck = "^1.22"
curve25519-dalek = "^5.0"
digest = "0.11.2"
getrandom = "^0.4"
hashbrown = { version = "0.17.0", default-features = false, features = [
    "allocator-api2",
    "default-hasher",
    "inline-more",
] }
hex = "0.4.3"
itertools = { version = "0.15.0", features = ["use_alloc"], default-features = false }
keccak = "^0.2.0"
p3-baby-bear = "0.6"
p3-field = "0.6"
rand_core = "^0.10"
rayon = "^1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
shake = "0.1.0"
spin = { version = "0.12", default-features = false, features = ["rwlock"] }
# Intra-workspace dependencies
spongefish = { version = "0.7.4", path = "spongefish" }
spongefish-circuit = { version = "0.7.4", path = "circuit" }
spongefish-derive = { version = "0.7.4", path = "derive" }
turboshake = "0.7.1"
zeroize = "^1.8.1"
